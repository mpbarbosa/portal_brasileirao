<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site's own mark, not the ⚽ emoji that stood here: a glyph is
         rendered by the platform's emoji font, so the tab showed a different
         picture on every OS and none of them was this app. `favicon.svg`
         carries a `prefers-color-scheme` block, which is why one file serves a
         light and a dark tab strip. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Portal Brasileirão — Campeonato Brasileiro Série A</title>
    <meta
      name="description"
      content="Acompanhe o Campeonato Brasileiro Série A: classificação, rodadas e detalhes das partidas em um só lugar."
    />
    <script>
      // Runs before first paint so the correct palette is applied immediately.
      // Without this the page renders dark, then repaints light — a flash that
      // no amount of CSS ordering fixes, because the choice lives in storage.
      (function () {
        try {
          var stored = localStorage.getItem("portal-brasileirao:theme");
          var pref = stored === "light" || stored === "dark" ? stored : null;
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = pref || (light ? "light" : "dark");
        } catch (e) {
          // Private mode can throw on localStorage; dark is the fallback.
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
