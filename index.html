<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%BD</text></svg>"
    />
    <title>Portal Brasileirão — Campeonato Brasileiro Série A</title>
    <meta
      name="description"
      content="Acompanhe o Campeonato Brasileiro Série A: classificação, rodadas e detalhes das partidas em um só lugar."
    />
    <script>
      // Runs before first paint so the correct palette is applied immediately.
      // Without this the page renders dark, then repaints light — a flash that
      // no amount of CSS ordering fixes, because the choice lives in storage.
      (function () {
        try {
          var stored = localStorage.getItem("portal-brasileirao:theme");
          var pref = stored === "light" || stored === "dark" ? stored : null;
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = pref || (light ? "light" : "dark");
        } catch (e) {
          // Private mode can throw on localStorage; dark is the fallback.
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
