# Keep the pins current so a runtime deprecation arrives as a pull request
# rather than as a red build on a commit that changed nothing.
#
# This exists because the alternative was measured rather than imagined. The
# deploy of 35a7074 ended with a warning that actions/download-artifact@v6 and
# aws-actions/configure-aws-credentials@v5 were being force-run on node24, and
# closing it by hand cost a survey of six actions across three workflows, two
# release-note readings for the breaking changes, a pull request, a merge and a
# deploy. Dependabot would have opened that pull request itself, before the
# warning ever appeared. See docs/cicd-plan.md, D4.
#
# It needs no secrets to be useful here, which is not true of every repository:
# `check` and `e2e` run against the frozen snapshot with no token by design, so
# a Dependabot pull request — which gets a read-only token and no secrets — sees
# exactly the same signal as any other. That is a property of "CI needs no
# secrets" in CLAUDE.md, and a reason not to trade it away later.

version: 2
updates:
  # The half that has already cost something, and the cheaper half to accept: an
  # action pin is a few lines, the blast radius of a bad bump is one workflow,
  # and CI reports it on the pull request itself. So all of them are grouped
  # into one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # The npm half is split on purpose. Minor and patch arrive as ONE grouped pull
  # request, because twenty separate ones is how a person starts merging them
  # without looking. A major arrives on its OWN, because express, vite or react
  # crossing a major is a change to read rather than a change to approve — and
  # anything in `dependencies` ships to the host, which installs it with
  # `npm ci --omit=dev`.
  #
  # Monday rather than Tuesday: sync-broadcasts already runs Tuesday 09:00 UTC,
  # and two automated pushes landing on one morning is how the second gets
  # merged unread alongside the first.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      # Both of the groups below exist because of what the FIRST run of this
      # file produced. Order matters: a dependency joins the first group it
      # matches, so the specific ones must precede the catch-all.

      # vite and its React plugin are a pair, not two packages. plugin-react 6
      # declares `peer vite@^8`, so Dependabot offering it against vite 6
      # produced a pull request that could not install, let alone merge — it
      # failed at `npm ci` with ERESOLVE before any code ran. Grouping them
      # means their majors arrive as one reviewable change, or not at all.
      vite:
        patterns: ["vite", "@vitejs/*"]

      # esbuild is 0.x, where the MINOR is the breaking position — semver says
      # 0.25 -> 0.28 is a minor, and Dependabot correctly grouped it as one,
      # but for a 0.x package that is a major in everything except the number.
      # It bundles server.ts into dist/server.cjs, so a surprise there changes
      # the artifact that ships.
      #
      # This one is the more marginal of the two, and the reason is worth
      # stating: `check` builds the bundle AND boots it AND smoke-tests three
      # endpoints, so the 0.25 -> 0.28 bump was in fact well covered and went
      # green. Isolating it does not add safety the gates lack; it makes a
      # FAILURE unambiguous, by keeping the one package whose breakage is
      # mis-classified by semver out of a group of five.
      esbuild:
        patterns: ["esbuild"]

      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
