name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. Cancelling a main run could kill a deploy
  # between "payload delivered" and "service restarted".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build production payload
        run: npm run build

      - name: Verify the bundled server boots and serves
        # The bundle is where a runtime dep stranded in devDependencies shows up;
        # `npm run dev` cannot catch that. No token: this exercises the offline
        # fallback, so CI never depends on the upstream being healthy.
        env:
          NODE_ENV: production
          PORT: "3399"
          STRICT_PORT: "true"
          FOOTBALL_DATA_TOKEN: ""
        run: |
          node dist/server.cjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3399/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup" >&2
              exit 1
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3399/api/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:3399/api/standings | grep -q '"source"'
          curl -sf http://127.0.0.1:3399/ | grep -q "Portal Brasileirão"

      - name: Shellcheck the deploy scripts
        run: shellcheck scripts/*.sh shell_scripts/*.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on the exact Playwright version: a version bump needs a matching
      # browser build, so a stale cache would fail with "Executable doesn't exist".
      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite boots its own server with DISABLE_FOOTBALL_DATA=true, so it
      # needs no API token and cannot be broken by live results changing.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token AWS trusts
    # Serialize deploys: two overlapping releases would race on the same host.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: sa-east-1
      INSTANCE_ID: i-03a9afc8a469edc89
      ARTIFACT_BUCKET: portal-brasileirao-deploy-655139684612
      SITE_URL: https://brasileirao.mpbarbosa.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build production payload
        run: npm run build

      - name: Package the release
        # shell_scripts travels with the payload so the host always runs the
        # deploy logic that matches the release it just received.
        run: |
          tar -czf release.tar.gz dist package.json package-lock.json shell_scripts
          ls -lh release.tar.gz

      - name: TEMPORARY - show OIDC claims
        # Prints only the sub/aud claims so the trust policy can be matched to
        # what GitHub actually sends. The token itself is never printed.
        run: |
          set -euo pipefail
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          payload=$(echo "$token" | cut -d. -f2)
          # base64url -> base64, pad to a multiple of 4
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="${payload}$(printf '=%.0s' $(seq 1 $pad))"
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, ref, workflow_ref, event_name}'

      # OIDC: no long-lived AWS keys live in GitHub. The role trusts only
      # refs/heads/main of this repository.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::655139684612:role/portal-brasileirao-deploy
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish the artifact
        run: |
          aws s3 cp release.tar.gz \
            "s3://${ARTIFACT_BUCKET}/releases/${GITHUB_SHA}.tar.gz" \
            --region "$AWS_REGION"

      - name: Install the release on the host
        # Delivered over SSM, so the host needs no inbound SSH and the security
        # group stays pinned to the maintainer's address.
        #
        # AWS-RunShellScript executes under /bin/sh (dash): no `pipefail`, no
        # bashisms. The helper scripts it calls are invoked with bash and keep
        # their own strict mode.
        run: |
          set -euo pipefail
          params=$(jq -n --arg bucket "$ARTIFACT_BUCKET" --arg sha "$GITHUB_SHA" --arg region "$AWS_REGION" '{
            commands: [
              "set -eu",
              "BUCKET=\($bucket)",
              "KEY=releases/\($sha).tar.gz",
              "STAGING=$(sudo -u ubuntu mktemp -d /tmp/release-XXXXXXXX)",
              "trap \u0027rm -rf \"$STAGING\"\u0027 EXIT INT TERM",
              "sudo -u ubuntu aws s3 cp \"s3://$BUCKET/$KEY\" \"$STAGING/release.tar.gz\" --region \($region)",
              "sudo -u ubuntu tar -xzf \"$STAGING/release.tar.gz\" -C \"$STAGING\"",
              "sudo -u ubuntu bash \"$STAGING/shell_scripts/07_install_release.sh\" \"$STAGING\""
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$params" \
            --comment "deploy ${GITHUB_SHA:0:7} via GitHub Actions" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "--- host stdout ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          echo "--- host stderr ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy failed on the host with status: $status"
            exit 1
          fi

      - name: Verify the live site
        # The host health-checks itself during redeploy; this proves the result
        # is reachable from outside, and that the process actually restarted.
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if curl -sf --max-time 10 "${SITE_URL}/api/health" > health.json; then break; fi
            sleep 5
          done
          cat health.json
          jq -e '.status == "ok"' health.json > /dev/null

          uptime=$(jq -r '.uptime' health.json)
          echo "Reported uptime: ${uptime}s"
          # A long uptime means the old process is still serving — the restart
          # silently did not happen.
          awk -v u="$uptime" 'BEGIN { if (u > 300) { print "::error::Service did not restart (uptime " u "s)"; exit 1 } }'

          curl -sf --max-time 10 "${SITE_URL}/api/standings" | jq -e '.source' > /dev/null
          echo "Live at ${SITE_URL}"
