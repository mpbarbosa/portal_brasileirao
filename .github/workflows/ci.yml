name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_non_descendant:
        description: "Deploy even though the commit is an ancestor of what is live (a deliberate rollback)"
        type: boolean
        default: false

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. Cancelling a main run could kill a deploy
  # between "payload delivered" and "service restarted".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    outputs:
      # The digest of the payload this job proved. `deploy` asserts the artifact
      # it downloads still hashes to this, so "the tested build is the shipped
      # build" is a checked fact rather than an assumption about determinism.
      payload_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc rather than repeated here. Both jobs, the
          # sync-broadcasts workflow, package.json's `engines` and the host
          # floor in shell_scripts/01 all have to name one Node major, and a
          # literal per file is how they came to disagree. See
          # tests/node-version.test.ts, which fails when they do.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Colour tokens and contrast
        # Two failures in one: `src/index.css` having drifted from the generator
        # that produces it, and any text pairing falling below AA. The second is
        # the reason this runs in CI rather than on request — contrast is the
        # kind of thing that is measured once, written into a comment, and then
        # quietly stops being true when someone adds a background token.
        run: npm run test:tokens

      - name: Build production payload
        run: npm run build

      - name: Verify the bundled server boots and serves
        # The bundle is where a runtime dep stranded in devDependencies shows up;
        # `npm run dev` cannot catch that. No token: this exercises the offline
        # fallback, so CI never depends on the upstream being healthy.
        env:
          NODE_ENV: production
          PORT: "3399"
          STRICT_PORT: "true"
          FOOTBALL_DATA_TOKEN: ""
        run: |
          node dist/server.cjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3399/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup" >&2
              exit 1
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3399/api/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:3399/api/standings | grep -q '"source"'
          curl -sf http://127.0.0.1:3399/ | grep -q "Portal Brasileirão"

      - name: Shellcheck the deploy scripts
        run: shellcheck scripts/*.sh shell_scripts/*.sh

      # Shellcheck reads those scripts; these two run them. shell_scripts/
      # travels inside the payload packaged below and the host executes it on
      # arrival, so a flip-back that no longer flips back ships with the very
      # release that needs it, and a backup that cannot restore is discovered
      # on the morning it is wanted. Both harnesses are hermetic — no network,
      # no AWS, no token, ~17s together — which is precisely why these can gate
      # a release where check-hymns and check-stadium-photos cannot: a red build
      # here means this commit broke something, never that a third party had a
      # bad minute.
      #
      # They sit before Package the release deliberately. Everything the tarball
      # carries has now been exercised rather than only read.
      - name: Rehearse the flip-back (shell_scripts/06, 07)
        run: ./scripts/rehearse-flip-back.sh

      - name: Rehearse the accounts backup round trip (shell_scripts/09, 10)
        run: ./scripts/rehearse-accounts-backup.sh

      # Everything above has passed, so THIS dist/ is the one that type-checked,
      # passed the unit suite, booted as a bundle and served three endpoints.
      # Packaging it here — rather than rebuilding in `deploy` — is what makes
      # the artifact that ships the artifact that was tested. The two builds
      # agreed in practice, but "in practice" was doing the work that
      # build-once-promote does structurally, and the divergence it guards
      # against is the kind that appears once, under a toolchain change, at the
      # worst possible moment.
      #
      # Only on a run that could deploy. A pull_request run builds and
      # smoke-tests exactly the same way, but its HEAD is the synthetic merge
      # ref rather than a commit that will ever ship, so uploading 19 MB per PR
      # would buy nothing.
      - name: Package the release
        id: package
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          # shell_scripts travels inside the payload so the host always runs the
          # deploy logic matching the release it just received.
          tar -czf release.tar.gz dist package.json package-lock.json shell_scripts
          digest="$(sha256sum release.tar.gz | cut -d' ' -f1)"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"
          echo "Packaged $(du -h release.tar.gz | cut -f1), sha256 ${digest}"

      - name: Upload the release payload
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          # S3 is the durable store and the rollback source; this is only the
          # handoff between two jobs of one run.
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  screenshots:
    name: README screenshots are current
    runs-on: ubuntu-latest
    # Deliberately NOT in `deploy`'s `needs`. This reports a documentation debt,
    # and a documentation debt must never be able to stop a release. A stale
    # README is a defect; a frozen deploy is an outage waiting to be noticed,
    # and the second should not be the price of the first. That is the durable
    # reason, and it holds however the check itself is later rewritten.
    #
    # The history, because it is the reason anyone thought to look. This was a
    # step inside `check`, and in August 2026 it deadlocked the pipeline. At the
    # time, images could only be captured from the deployed site, so between an
    # appearance change landing on main and its release there was no capture
    # that could satisfy the check — and with `deploy` gated on it, the release
    # that would have made capture possible never ran. 0673a52 froze the club
    # column and production stopped at cfb4a98 behind it, four commits back.
    #
    # That was not bad luck with one commit. Every later commit touching
    # src/components, src/index.css, src/App.tsx or index.html would have done
    # the same, because the gate was unsatisfiable in precisely the window it
    # fired in.
    #
    # Note the capture constraint above is stated in the past tense on purpose:
    # it is being removed separately, by teaching the capture rule to mean "must
    # depict this commit" rather than "must be production". Do not read it as a
    # standing rule and do not reintroduce "deploy first, capture second" — that
    # ordering was a symptom of the impossibility, not a practice worth keeping.
    #
    # Red here means someone owes a screenshot refresh and can go and take it —
    # or, where the edit provably cannot reach a paint, owes a sentence saying
    # why. The check honours a `Screenshots-unaffected:` trailer and prints it;
    # scripts/check-screenshots.sh has the syntax and the case it was added for.
    #
    # AND it must not make the run LIE about the release either. That is a
    # second failure with the same root, and it needs its own mechanism:
    # staying out of `deploy`'s `needs` stops this blocking a release, and does
    # nothing about it reddening the run that carried one. A failed job sets the
    # whole run's conclusion to `failure`, so a release that built, shipped and
    # verified its own commit at /api/health was reported as a failed run.
    #
    # Measured rather than estimated, over the 30 push-on-main runs before this
    # change: 17 concluded `failure`, and in all 17 the ONLY job that failed was
    # this one and `deploy` succeeded. Not "usually a false alarm" — every red
    # push-on-main run in that window was this defect, and every one of them
    # shipped. Six concluded `success`; the rest were cancelled or still
    # running. CLAUDE.md carried a standing warning to read /api/health rather
    # than the badge, which is a note asking people to distrust a signal rather
    # than a signal worth trusting.
    #
    # `continue-on-error` separates the two. The job still runs, still goes red,
    # and still says what is owed; the run concludes on whether the release
    # worked. An advisory that can only speak by lying about the release is
    # worse than one that speaks in the step summary — which is where the step
    # below puts it, because a green run is one nobody opens.
    #
    # It also unjams `reconcile.yml`'s rollback hold. That asks for the last
    # SUCCESSFUL ci.yml run on main and compares it against the last rollback,
    # so every release this job reddened was invisible to it: after a rollback,
    # a fix that deployed and was reddened here would have left the reconciler
    # holding against a stale timestamp rather than clearing itself.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads trees and walks commits across the range since the
          # last capture, which a depth-1 clone cannot answer. Only this job
          # needs the history.
          fetch-depth: 0

      # The findings go to the step summary, not only to this job's log. Now
      # that the run concludes on the release, a reader scanning main sees green
      # and has no reason to open this job at all — so what is owed has to sit
      # somewhere they land rather than somewhere they navigate to. The summary
      # is the top of the run page and of the PR check's own page, and the pull
      # request is where this debt is actionable: the change under review is
      # what created it.
      #
      # The verdict is taken from the exit status and never by parsing the
      # output. A summary that disagreed with the job's own result would be
      # worse than no summary at all.
      #
      # The output is folded away because most of it is the refresh recipe,
      # which matters once you have decided to act and buries the finding until
      # then. The finding itself — which commits, and what would clear them —
      # is in the first lines of that block.
      - name: Check, and report what is owed in the run summary
        run: |
          report="$RUNNER_TEMP/check-screenshots.txt"
          status=0
          ./scripts/check-screenshots.sh >"$report" 2>&1 || status=$?

          cat "$report"

          {
            if [ "$status" -eq 0 ]; then
              echo "### README screenshots are current"
            else
              echo "### README screenshots need a refresh"
              echo
              echo "**The release is unaffected.** This job is advisory and is not in"
              echo "\`deploy\`'s \`needs\`, so a run carrying it red can still have built,"
              echo "shipped and verified a release. Read the \`deploy\` job for that."
              echo
              echo "Someone owes a capture of \`docs/screenshots\`, or a"
              echo "\`Screenshots-unaffected:\` trailer saying why the edit cannot move a"
              echo "rendered pixel. The output below names the commits."
            fi

            echo
            echo "<details><summary>check-screenshots.sh</summary>"
            echo
            echo '```'
            cat "$report"
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$status"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc rather than repeated here. Both jobs, the
          # sync-broadcasts workflow, package.json's `engines` and the host
          # floor in shell_scripts/01 all have to name one Node major, and a
          # literal per file is how they came to disagree. See
          # tests/node-version.test.ts, which fails when they do.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on the exact Playwright version: a version bump needs a matching
      # browser build, so a stale cache would fail with "Executable doesn't exist".
      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite boots its own server with DISABLE_FOOTBALL_DATA=true, so it
      # needs no API token and cannot be broken by live results changing.
      - name: Run end-to-end tests
        run: npm run test:e2e

      # The bundle is what production runs, and until this step existed no spec
      # had ever touched it: all of them boot `server.ts` through tsx with Vite
      # in middleware mode, while `check` asks the bundle only three questions.
      # The production branch of `server.ts` is genuinely different code — it
      # serves `dist/` through express.static, reads the shell once at boot, and
      # has no Vite — so `registerSpaFallback`, `injectMeta`, the 404 rules and
      # the JSON-LD all reach a reader through a path nothing exercised.
      #
      # Only the three specs covering that path run here. Re-running the whole
      # suite against the bundle would double the wall clock to re-assert what
      # the dev run already proved.
      #
      # It builds its own payload rather than taking `check`'s artifact, and the
      # distinction matters: this tests the production CODE PATH, not the shipped
      # BYTES. D3's digest covers the bytes, and `check` only packages on a run
      # that can deploy — so waiting for an artifact would leave every pull
      # request without this.
      - name: Build the production payload for the bundle run
        run: npm run build

      - name: Run the production-path specs against dist/server.cjs
        env:
          PLAYWRIGHT_TARGET: bundle
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [check, e2e]
    # Any run *for main*, not only a push-triggered one. The event gate this
    # replaces made workflow_dispatch useless precisely when it was needed: with
    # push events being dropped during the Actions incident of 2026-08-26 there
    # was no way to carry a merged commit to the host, and 6325fa5, e065a8d and
    # 8fa12e5 are empty commits that exist only to emit a push event. It is also
    # what makes the ancestry guard below testable — main only ever moves
    # forward, so a push can never present an ancestor to refuse.
    # `pull_request` runs carry refs/pull/N/merge and so are still excluded.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Gives the repository a Deployments record: what went to production, when,
    # from which run, and whether it succeeded. Until now the only account of a
    # release was the CI run that performed it, which is a poor thing to
    # reconstruct an incident from — runs are listed by workflow rather than by
    # what they changed, and the one that matters is indistinguishable from the
    # 400 that did not deploy. Defect 1 was reconstructed by hand from run
    # timestamps for exactly this reason.
    #
    # It is also the only place a protection rule can be hung. None exists today
    # and the job's behaviour is therefore unchanged; note that adding a required
    # reviewer to the `production` environment later would make every deploy wait
    # for a human, which is a deliberate choice to make and not a side effect to
    # discover.
    #
    # `rollback.yml` deliberately does NOT carry this, so the record is one of
    # forward releases only and will name the wrong sha as live after a rollback.
    # That is a known incompleteness rather than an oversight: its single job also
    # serves the list-only mode, which changes nothing on the host, and recording
    # a deployment for a run that only read a bucket would be worse than the gap.
    # Closing it means splitting that job in two — see docs/cicd-plan.md, gap B.
    environment:
      name: production
      url: https://brasileirao.mpbarbosa.com
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token AWS trusts
    # Serialize deploys: two overlapping releases would race on the same host.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: sa-east-1
      INSTANCE_ID: i-03a9afc8a469edc89
      ARTIFACT_BUCKET: portal-brasileirao-deploy-655139684612
      SITE_URL: https://brasileirao.mpbarbosa.com
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry guard below asks whether the commit being released is an
          # ancestor of the one already live. A depth-1 clone does not contain the
          # live commit, let alone the history connecting the two, so it cannot
          # answer — and a guard that cannot answer fails open and protects
          # nothing. Same reason the `screenshots` job takes the full history.
          fetch-depth: 0

      # No setup-node, no `npm ci`, no build. This job used to rebuild the
      # payload from scratch, which meant the bytes that reached production were
      # never the bytes `check` smoke-tested — only a second build of the same
      # commit. It now promotes the proven artifact instead. Everything left
      # here needs aws, jq, git and curl, all present on the runner.
      # v8, beside `upload-artifact@v6` in `check`. That asymmetry looks like an
      # oversight and is not one: the two live in separate repositories and
      # version independently, and `download-artifact` did not reach node24 until
      # v7 while `upload-artifact` was already there at v6. Runners currently
      # force a node20 action onto node24 and warn; eventually they stop forcing
      # and start failing. Do not "correct" these two to match.
      #
      # v8 also errors on a digest mismatch rather than warning, which layers
      # with the step below rather than duplicating it: GitHub checks the
      # artifact is what was uploaded, that step checks it is what `check` proved.
      - name: Download the payload that check proved
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}

      - name: Verify it is byte-for-byte the payload that was tested
        # Promotion is only worth anything if the thing promoted is the thing
        # tested. `check` published the digest of what it proved; if these ever
        # disagree, something rewrote the payload between the two jobs and this
        # release must not go out.
        env:
          EXPECTED: ${{ needs.check.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::error::check published no payload digest — refusing to ship an unverified payload."
            exit 1
          fi
          actual="$(sha256sum release.tar.gz | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Payload digest mismatch. check proved ${EXPECTED}, this is ${actual}."
            exit 1
          fi
          echo "Payload sha256 ${actual} — byte-for-byte what check booted and smoke-tested."
          ls -lh release.tar.gz

      # OIDC: no long-lived AWS keys live in GitHub. The role's trust policy
      # matches the token's `sub` claim exactly, and this account issues the
      # *immutable* form of that claim — it embeds the numeric owner and repo
      # ids (repo:owner@<id>/repo@<id>:ref:...), not the documented
      # repo:owner/repo:ref:... form. A policy written against the documented
      # shape silently never matches. If role assumption starts failing with
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity", print the
      # claim before touching anything else.
      #
      # v6 is the first node24 release of this action. Its only breaking change
      # is that runtime and the runner floor (v2.327.1) that comes with it —
      # role-to-assume, role-session-name and aws-region are unchanged, which is
      # the part that matters here given the claim-matching above.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::655139684612:role/portal-brasileirao-deploy
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish the artifact
        run: |
          aws s3 cp release.tar.gz \
            "s3://${ARTIFACT_BUCKET}/releases/${GITHUB_SHA}.tar.gz" \
            --region "$AWS_REGION"

      - name: Refuse a release that would move production backwards
        # `concurrency: deploy-production` serialises releases; it does not order
        # them. On 2026-08-26 a queue that drained after an Actions incident
        # installed cbf98f7 and then 8d95b17, which is its parent — production
        # moved backwards, and *every check this pipeline had passed*, because
        # "Verify the live site is this commit" below asks whether the live commit
        # is the one this run built, and it was. Nothing asked whether it was
        # newer than what it replaced. This does.
        #
        # Placed immediately before the install rather than at the top of the job,
        # so the window between reading the live commit and replacing it is as
        # narrow as it can be. The S3 object is already published by now and that
        # is fine: it is keyed by sha, harmless, and a rollback will want it there.
        #
        # It fails OPEN on anything it cannot read — an unreachable site, a health
        # payload without a usable sha, a commit not in this repository. That is
        # deliberate and is the whole difference between a guard and a lock:
        # during an outage the ability to deploy is worth more than the ordering
        # this protects, and a site that is down cannot tell you what it is running.
        env:
          # `github.event.inputs`, not `inputs`: the latter is only populated for
          # workflow_dispatch and workflow_call, and this step runs on every push
          # to main. `github.event` always exists and simply carries no `inputs`
          # key for a push, so the fallback takes over. Same form as
          # sync-broadcasts.yml, which has been running on it for months.
          ALLOW_NON_DESCENDANT: ${{ github.event.inputs.allow_non_descendant || 'false' }}
        run: |
          set -euo pipefail
          incoming="$GITHUB_SHA"

          if [ "$ALLOW_NON_DESCENDANT" = "true" ]; then
            echo "::warning::Ancestry guard overridden — this release may move production backwards."
            exit 0
          fi

          if ! curl -sf --max-time 10 "${SITE_URL}/api/health" -o live.json; then
            echo "::warning::Could not read ${SITE_URL}/api/health — installing without the ancestry check."
            exit 0
          fi

          live_short="$(jq -r '.sha // empty' live.json)"
          # A locally-stamped build can carry a -dirty suffix; production should
          # never serve one, but strip it rather than fail open on the surprise.
          live_short="${live_short%-dirty}"

          if [ -z "$live_short" ] || [ "$live_short" = "unknown" ]; then
            echo "::warning::Live site reports no usable commit — installing without the ancestry check."
            exit 0
          fi

          if ! live="$(git rev-parse --verify --quiet "${live_short}^{commit}")"; then
            echo "::warning::Live commit ${live_short} is not in this repository — installing without the ancestry check."
            exit 0
          fi

          if [ "$live" = "$incoming" ]; then
            echo "Live is already ${live_short}. Reinstalling the same commit."
            exit 0
          fi

          if git merge-base --is-ancestor "$incoming" "$live"; then
            echo "::error::Refusing to install ${incoming:0:7}: it is an ancestor of ${live_short}, which is live."
            echo "::error::Installing it would undo $(git rev-list --count "${incoming}..${live}") commit(s) already in production."
            echo "::error::If this is a deliberate rollback, re-run from the Actions tab with allow_non_descendant=true."
            exit 1
          fi

          if git merge-base --is-ancestor "$live" "$incoming"; then
            echo "OK: ${incoming:0:7} is $(git rev-list --count "${live}..${incoming}") commit(s) ahead of live ${live_short}."
          else
            # Neither contains the other. History was rewritten, or the live build
            # came from somewhere this checkout cannot see. Not a backwards move,
            # so not this guard's call to make — but worth saying out loud.
            echo "::warning::${incoming:0:7} and live ${live_short} have diverged; neither contains the other. Installing anyway."
          fi

      - name: Install the release on the host
        # Delivered over SSM, so the host needs no inbound SSH and the security
        # group stays pinned to the maintainer's address.
        #
        # AWS-RunShellScript executes under /bin/sh (dash): no `pipefail`, no
        # bashisms. The helper scripts it calls are invoked with bash and keep
        # their own strict mode.
        run: |
          set -euo pipefail
          params=$(jq -n --arg bucket "$ARTIFACT_BUCKET" --arg sha "$GITHUB_SHA" --arg region "$AWS_REGION" '{
            commands: [
              "set -eu",
              "BUCKET=\($bucket)",
              "KEY=releases/\($sha).tar.gz",
              "STAGING=$(sudo -u ubuntu mktemp -d /tmp/release-XXXXXXXX)",
              "trap \u0027rm -rf \"$STAGING\"\u0027 EXIT INT TERM",
              "sudo -u ubuntu aws s3 cp \"s3://$BUCKET/$KEY\" \"$STAGING/release.tar.gz\" --region \($region)",
              "sudo -u ubuntu tar -xzf \"$STAGING/release.tar.gz\" -C \"$STAGING\"",
              "sudo -u ubuntu bash \"$STAGING/shell_scripts/07_install_release.sh\" \"$STAGING\""
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$params" \
            --comment "deploy ${GITHUB_SHA:0:7} via GitHub Actions" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "--- host stdout ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          echo "--- host stderr ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy failed on the host with status: $status"
            exit 1
          fi

      - name: Verify the live site is this commit
        # The host health-checks itself during redeploy; this proves the result
        # is reachable from outside *and* that it is the build we just made.
        # Comparing the commit is strictly stronger than the uptime heuristic it
        # replaces: a fast restart of the previous bundle would pass that check
        # and fail this one.
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:7}"

          for _ in $(seq 1 20); do
            if curl -sf --max-time 10 "${SITE_URL}/api/health" > health.json; then break; fi
            sleep 5
          done
          cat health.json

          jq -e '.status == "ok"' health.json > /dev/null

          live=$(jq -r '.sha' health.json)
          if [ "$live" != "$expected" ]; then
            echo "::error::Live site reports ${live}, expected ${expected} — the deploy did not take"
            exit 1
          fi
          echo "Live commit: ${live} (built $(jq -r '.builtAt' health.json))"

          curl -sf --max-time 10 "${SITE_URL}/api/standings" | jq -e '.source' > /dev/null
          echo "Live at ${SITE_URL}"
