name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build production payload
        run: npm run build

      - name: Verify the bundled server boots and serves
        # The bundle is where a runtime dep stranded in devDependencies shows up;
        # `npm run dev` cannot catch that. No token: this exercises the offline
        # fallback, so CI never depends on the upstream being healthy.
        env:
          NODE_ENV: production
          PORT: "3399"
          STRICT_PORT: "true"
          FOOTBALL_DATA_TOKEN: ""
        run: |
          node dist/server.cjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3399/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup" >&2
              exit 1
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3399/api/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:3399/api/standings | grep -q '"source"'
          curl -sf http://127.0.0.1:3399/ | grep -q "Portal Brasileirão"

      - name: Shellcheck the deploy scripts
        run: shellcheck scripts/*.sh shell_scripts/*.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on the exact Playwright version: a version bump needs a matching
      # browser build, so a stale cache would fail with "Executable doesn't exist".
      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite boots its own server with DISABLE_FOOTBALL_DATA=true, so it
      # needs no API token and cannot be broken by live results changing.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
