name: Roll back production

# Install a release that S3 already holds, over whatever is live now.
#
# This deliberately does NOT go through ci.yml. A release in S3 was built,
# booted and smoke-tested by `check` when it was made, and its digest was
# asserted before it ever shipped — rebuilding it to roll back would test it
# again with a *newer* toolchain, which is the one thing you do not want when
# the point is to get back to known-good bytes. It is also why there is no
# ancestry guard here: going backwards is the entire purpose, where in ci.yml
# it is the accident being prevented.
#
# What this buys over `git revert` is speed and needing no build: a revert plus
# the ordinary pipeline is about four minutes and is the right answer when
# there is time to think. This is about forty seconds.
#
# Dispatching with an EMPTY sha lists what S3 holds and changes nothing. That
# is the safe default, and it doubles as the answer to a question this
# repository cannot otherwise answer: nothing here defines a lifecycle policy
# on `releases/`, so what is actually still there is discovered by looking.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit sha, or a deploy-* tag (or any ref) to resolve. EMPTY = list what is available and do nothing."
        required: false
        type: string

# The same group ci.yml's deploy job uses, so a rollback and a release can
# never be installing at the same moment.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Install a stored release over what is live
    runs-on: ubuntu-latest
    env:
      AWS_REGION: sa-east-1
      INSTANCE_ID: i-03a9afc8a469edc89
      ARTIFACT_BUCKET: portal-brasileirao-deploy-655139684612
      SITE_URL: https://brasileirao.mpbarbosa.com
      TARGET_SHA: ${{ github.event.inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # To say how far back the target is, and to refuse a sha that is not
          # a commit in this repository at all.
          fetch-depth: 0
          # And so a `deploy-*` tag resolves. fetch-depth: 0 is documented to
          # bring tags along, but this is the input a person reaches for in an
          # incident and "documented to" is not the standard the rest of this
          # pipeline is held to. Stating it costs nothing and cannot regress.
          fetch-tags: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::655139684612:role/portal-brasileirao-deploy
          role-session-name: gha-rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: What is live, and what is available
        run: |
          set -euo pipefail

          live="$(curl -sf --max-time 10 "${SITE_URL}/api/health" | jq -r '.sha // "unknown"' || echo unreachable)"
          echo "Live now: ${live}"
          { echo "### Rollback"; echo "Live now: \`${live}\`"; } >> "$GITHUB_STEP_SUMMARY"

          # Best-effort. The deploy role is known to hold s3:PutObject and the
          # SSM permissions, because the release path uses them every day; it
          # may or may not hold s3:ListBucket. A failure here is reported and
          # does NOT stop a rollback, because the host is what actually fetches
          # the object and its `aws s3 cp` will fail loudly if the key is gone.
          #
          # stdout and stderr are captured TOGETHER into one variable, so a
          # failure carries AWS's own words. The first version of this wrote
          # stderr to a file and printed `head -1` of it, which came back blank
          # on the first real run — leaving "Could not list the bucket — " and
          # nothing after the dash. A diagnostic that loses the diagnosis is
          # worse than none, because it looks like it reported something.
          #
          # The query is null-safe for the same class of reason: jmespath's
          # sort_by throws on a null `Contents`, which is what an EMPTY prefix
          # returns. Without `|| ` + backtick-empty-list, "the bucket is empty"
          # and "you may not list the bucket" are indistinguishable — and those
          # two want very different responses.
          echo ""
          echo "Releases in s3://${ARTIFACT_BUCKET}/releases/ (newest last):"
          if listing="$(aws s3api list-objects-v2 --bucket "$ARTIFACT_BUCKET" --prefix releases/ \
               --query 'sort_by(Contents || `[]`, &LastModified)[].[LastModified,Size,Key]' \
               --output text 2>&1)"; then
            if [ -z "$listing" ] || [ "$listing" = "None" ]; then
              echo "::warning::The bucket answered and releases/ is EMPTY. There is nothing to roll back to."
              echo "::warning::Every stored release has been expired — the bucket has a lifecycle policy, and nothing in this repository defines it."
            else
              printf '%s\n' "$listing"
            fi
          else
            echo "::warning::Could not list the bucket. AWS said:"
            printf '%s\n' "$listing" | sed 's/^/    /'
            # Only offer the IAM reading when AWS actually said AccessDenied.
            # Printing it unconditionally sends someone to edit a role policy
            # over a NoSuchBucket or a network error, which is a worse outcome
            # than saying nothing.
            if printf '%s' "$listing" | grep -q 'AccessDenied'; then
              echo "::warning::The deploy role needs s3:ListBucket to offer this listing — the release path never needed it, which is why this is the first time it shows."
            fi
            echo "A rollback can still proceed: name the sha explicitly and the host will fetch it."
          fi

      - name: Stop here when no sha was given
        if: ${{ github.event.inputs.sha == '' }}
        run: |
          echo "No sha given — listing only, nothing installed."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Listing only. Re-run with a sha or a \`deploy-*\` tag to install one." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the target is a real commit, and say how far back it is
        if: ${{ github.event.inputs.sha != '' }}
        run: |
          set -euo pipefail

          # The S3 key is the FULL sha, so that is what every later step needs.
          # Anything else — a `deploy-*` tag, a branch, an abbreviation — is
          # resolved here rather than refused, because the tag list is the only
          # release inventory a person can read without `s3:ListBucket`, and
          # making them expand it by hand mid-incident is the friction gap D
          # exists to remove.
          if ! printf '%s' "$TARGET_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            if resolved="$(git rev-parse --verify --quiet "${TARGET_SHA}^{commit}")"; then
              echo "::notice::Resolved '${TARGET_SHA}' to ${resolved}"
              echo "Resolved \`${TARGET_SHA}\` → \`${resolved}\`" >> "$GITHUB_STEP_SUMMARY"
              TARGET_SHA="$resolved"
              # Every later step reads TARGET_SHA from the job-level `env:`,
              # which holds the raw input. Writing here overrides it for them —
              # verified rather than assumed, by a throwaway workflow whose job
              # env said `from-job-env` and whose next step read
              # `from-github-env`. A step-level `env:` would still win over
              # this, and none of the later steps declares one.
              echo "TARGET_SHA=${resolved}" >> "$GITHUB_ENV"
            else
              echo "::error::'${TARGET_SHA}' is neither a commit nor a ref in this repository. Dispatch with an empty sha to list what is available, or pick a deploy-* tag."
              exit 1
            fi
          elif ! git rev-parse --verify --quiet "${TARGET_SHA}^{commit}" > /dev/null; then
            echo "::error::${TARGET_SHA} is not a commit in this repository."
            exit 1
          fi

          live="$(curl -sf --max-time 10 "${SITE_URL}/api/health" | jq -r '.sha // empty' || true)"
          if [ -n "$live" ] && live_full="$(git rev-parse --verify --quiet "${live%-dirty}^{commit}")"; then
            if git merge-base --is-ancestor "$TARGET_SHA" "$live_full"; then
              back="$(git rev-list --count "${TARGET_SHA}..${live_full}")"
              echo "::notice::Rolling BACK ${back} commit(s): ${live} -> ${TARGET_SHA:0:7}"
              echo "Rolling back **${back} commit(s)**: \`${live}\` → \`${TARGET_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::${TARGET_SHA:0:7} is not an ancestor of live ${live}. This is a sideways or forward move, not a rollback. Continuing because you named it explicitly."
            fi
          else
            echo "::warning::Could not read a usable live commit — installing ${TARGET_SHA:0:7} without saying what it replaces."
          fi

      - name: Install it on the host
        if: ${{ github.event.inputs.sha != '' }}
        run: |
          set -euo pipefail
          params=$(jq -n --arg bucket "$ARTIFACT_BUCKET" --arg sha "$TARGET_SHA" --arg region "$AWS_REGION" '{
            commands: [
              "set -eu",
              "BUCKET=\($bucket)",
              "KEY=releases/\($sha).tar.gz",
              "STAGING=$(sudo -u ubuntu mktemp -d /tmp/rollback-XXXXXXXX)",
              "trap 'rm -rf \"$STAGING\"' EXIT INT TERM",
              "sudo -u ubuntu aws s3 cp \"s3://$BUCKET/$KEY\" \"$STAGING/release.tar.gz\" --region \($region)",
              "sudo -u ubuntu tar -xzf \"$STAGING/release.tar.gz\" -C \"$STAGING\"",
              "sudo -u ubuntu bash \"$STAGING/shell_scripts/07_install_release.sh\" \"$STAGING\""
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$params" \
            --comment "ROLLBACK to ${TARGET_SHA:0:7} via GitHub Actions" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "--- host stdout ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          echo "--- host stderr ---"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

          if [ "$status" != "Success" ]; then
            echo "::error::Rollback failed on the host with status: ${status}. If the object is gone, the bucket's lifecycle policy expired it — see the listing above."
            exit 1
          fi

      - name: Verify the live site is the commit we asked for
        if: ${{ github.event.inputs.sha != '' }}
        run: |
          set -euo pipefail
          expected="${TARGET_SHA:0:7}"

          for _ in $(seq 1 20); do
            if curl -sf --max-time 10 "${SITE_URL}/api/health" > health.json; then break; fi
            sleep 5
          done
          cat health.json

          jq -e '.status == "ok"' health.json > /dev/null
          live=$(jq -r '.sha' health.json)
          if [ "$live" != "$expected" ]; then
            echo "::error::Live site reports ${live}, expected ${expected} — the rollback did not take"
            exit 1
          fi

          curl -sf --max-time 10 "${SITE_URL}/api/standings" | jq -e '.source' > /dev/null
          echo "Rolled back. Live commit: ${live}"
          {
            echo ""
            echo "Rolled back. Live commit \`${live}\`."
            echo ""
            echo "**Reconciliation is paused automatically.** \`reconcile.yml\` holds while a"
            echo "successful run of this workflow is newer than the last successful \`ci.yml\`"
            echo "run on \`main\` — otherwise it would see production behind \`main\` and undo"
            echo "this within fifteen minutes. It resumes on its own once a fix reaches"
            echo "\`main\` and deploys; there is no flag to remember to clear."
          } >> "$GITHUB_STEP_SUMMARY"
