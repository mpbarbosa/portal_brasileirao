name: Sync broadcasts

# CBF publishes broadcast information roughly two to three weeks ahead, so a
# weekly pass keeps the app current. Tuesday morning: after the weekend round
# has finished and while the next one is being announced.
on:
  schedule:
    - cron: "0 9 * * 2" # Tuesdays, 09:00 UTC (06:00 BRT)
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "How many days ahead to sync"
        required: false
        default: "28"

concurrency:
  group: sync-broadcasts
  cancel-in-progress: false

permissions:
  contents: write # to push the branch the refreshed data lands on
  pull-requests: write # to open, or add to, the pull request carrying it

jobs:
  sync:
    name: Refresh src/data/broadcasts.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide which branch this run writes to
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=automation/sync-broadcasts

          # An open pull request from that branch means a previous sync is still
          # waiting. Build on it rather than beside it: the sync merges into the
          # file rather than replacing it, but only across the window it is
          # asked about, so starting again from `main` would silently drop
          # whatever has since aged out of that window.
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // ""')

          if [ -n "$existing" ]; then
            echo "Continuing PR #${existing} on ${branch}."
            git fetch --depth=1 origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            echo "No open pull request from ${branch}; starting from ${GITHUB_SHA}."
            git switch -c "$branch"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "pr=${existing}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          # One Node major, named in .nvmrc — see tests/node-version.test.ts.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the token is configured
        # Without this the sync fails deep inside the script with a 400 from
        # football-data, which reads like an upstream problem rather than a
        # missing secret.
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::FOOTBALL_DATA_TOKEN is not set. Add it with:"
            echo "::error::  gh secret set FOOTBALL_DATA_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Sync the next few weeks
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          days="${{ github.event.inputs.days_ahead || '28' }}"
          from="$(date -u +%Y-%m-%d)"
          to="$(date -u -d "+${days} days" +%Y-%m-%d)"

          echo "Syncing ${from} .. ${to}"
          # Merges rather than replaces, so past rounds already in the file stay.
          npx tsx scripts/sync-broadcasts.ts "$from" "$to"

      - name: Verify the result still type-checks and passes its tests
        # A malformed write would otherwise be committed and only caught by the
        # push-triggered run, after the bad data is already on main.
        run: |
          npm run lint
          npm run test:unit

      - name: Commit, and open or add to the pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          PR: ${{ steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/broadcasts.ts; then
            echo "No new broadcasts published — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          added=$(git diff --numstat -- src/data/broadcasts.ts | awk '{print $1}')
          removed=$(git diff --numstat -- src/data/broadcasts.ts | awk '{print $2}')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/broadcasts.ts
          git commit -m "Sync broadcast channels from CBF

          Automated weekly sync (+${added}/-${removed} lines). CBF publishes
          roughly two to three weeks ahead, so this tops the file up rather
          than replacing it."

          if [ -n "$PR" ]; then
            # Building on the ref we fetched, so this is a fast-forward and a
            # rejection would be real information — somebody pushed to the
            # branch meanwhile. Do not force it away.
            git push origin "HEAD:${BRANCH}"
            echo "Added a commit to PR #${PR}."
          else
            # No open pull request, so the remote branch is either merged — in
            # which case its commits are already ancestors of ours and this is a
            # fast-forward regardless — or left behind by a closed one, which is
            # exactly what should be replaced. The branch is bot-owned; nothing
            # else writes to it.
            git push --force origin "HEAD:${BRANCH}"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync broadcast channels from CBF" \
              --body-file .github/pull-request-body/sync-broadcasts.md
            echo "Opened a pull request from ${BRANCH}."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          PR: ${{ steps.target.outputs.pr }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "### Broadcasts updated" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$PR" ]; then
              echo "Added to the open pull request #${PR} on \`${BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Opened a pull request from \`${BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Nothing deploys until it is merged — which is the point of the change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No change" >> "$GITHUB_STEP_SUMMARY"
            echo "CBF has published nothing new since the last run." >> "$GITHUB_STEP_SUMMARY"
          fi
          git --no-pager log --oneline -1 >> "$GITHUB_STEP_SUMMARY"
